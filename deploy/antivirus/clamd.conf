Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 2
MaxQueue 16
StreamMaxLength 1024M
MaxFileSize 1024M
MaxScanSize 1536M
MaxRecursion 16
MaxFiles 10000
MaxScanTime 120000
ReadTimeout 180
CommandReadTimeout 30
AlertExceedsMax yes
AlertEncrypted yes
LogTime yes
LogClean no
SelfCheck 600
