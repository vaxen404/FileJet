<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>Offline notes · FileJet</title><link rel="stylesheet" href="/filejet-offline/style.css"><script type="module" src="/filejet-offline/editor.js"></script></head>
<body><header><a href="/notes">← FileJet</a><h1>Offline notes</h1><button id="sync" type="button">Sync now</button></header><p id="status" role="status" aria-live="polite">Loading device storage…</p><main><aside aria-label="Saved notes"><button id="new" type="button">＋ New offline note</button><ul id="notes"></ul></aside><section id="editor" hidden><label for="title">Title</label><input id="title" maxlength="32" autocomplete="off"><label for="content">Content · Markdown</label><textarea id="content" spellcheck="true"></textarea><p id="save-state" role="status" aria-live="polite"></p><p id="note-error" role="alert"></p><div class="actions"><button id="copy" type="button" hidden>Save draft as new note</button><button id="server" type="button" hidden>Use server version</button><button id="download" type="button">Download draft</button><button id="remove" type="button">Remove device copy</button></div></section><p id="empty">Open a note in FileJet and choose “Edit offline”, or create a note here after signing in.</p></main><footer>Device copies stay in this browser. Reconnect to sync. Logging out of FileJet removes this account’s device copies.</footer></body></html>
